<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<!-- MOCK ONLY (docs/INTRO.md, "Opening flow"). Not linked from the game, nothing stored, no request but its own files and the
     light film. The game behind is a screenshot. Same Content-Security-Policy as the game.
     ?w=390|360|320 (phone width), ?auto=1 (plays the whole flow by itself, film shortened), ?step=splash|load|film|end|game
     (one state, still), ?ret=1 (a returning device). -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="data:,">
<title>שרטוט: פתיחה</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#020814;color:#E8F0FF;font-family:'Rubik','Heebo','Arial Hebrew','Noto Sans Hebrew',system-ui,sans-serif}
.ctl{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;padding:10px 8px;font-size:14px}
.ctl a{color:#9FFBEA;border:1px solid #2B4E85;border-radius:999px;padding:4px 10px;text-decoration:none}
.ctl a[aria-current]{background:#11295A}
.note{max-width:420px;margin:0 auto 8px;padding:0 12px;font-size:13px;color:#9DB2D6;text-align:center;min-height:18px}
.phone{position:relative;margin:0 auto 24px;overflow:hidden;border-radius:22px;box-shadow:0 0 0 2px #1C3566}
.under{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top;transform:translateY(10px);opacity:.0}
.phone.s-game .under{transform:none;opacity:1;transition:transform .35s ease-out .1s,opacity .25s linear}

/* the overlay: one navy surface from the first paint to the fade-out, so nothing of the game shows through */
.ov{position:absolute;inset:0;background:#050E22;display:flex;align-items:center;justify-content:center;overflow:hidden}
.s-game .ov{opacity:0;transition:opacity .45s ease-in;pointer-events:none}
.film{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#050E22;opacity:0;transition:opacity .35s linear}
.s-film .film,.s-end .film,.s-game .film{opacity:1}

.splash{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding-bottom:6%;transition:opacity .35s ease-in,transform .35s ease-in}
.splash::before{content:"";position:absolute;inset:0;background:radial-gradient(60% 34% at 50% 44%,rgba(46,230,197,.20),transparent 70%);opacity:0;animation:fade 1s ease-out .2s forwards}
.s-film .splash,.s-end .splash,.s-game .splash{opacity:0;transform:scale(1.12);pointer-events:none}
.logo{position:relative;width:min(84%,330px);height:auto;opacity:0;transform:scale(.6)}
.s-splash .logo,.s-load .logo,.s-film .logo{animation:pop .6s cubic-bezier(.34,1.56,.64,1) .15s forwards,shine 1.1s ease-in-out .9s 1}
.play{position:relative;display:inline-flex;align-items:center;gap:10px;font:inherit;font-weight:800;font-size:22px;color:#0B1E3F;background:#FFD23F;border:0;border-radius:999px;min-height:60px;padding:0 30px;box-shadow:inset 0 -4px 0 #E8B91F,0 4px 0 #050E22;cursor:pointer;opacity:0;transform:translateY(10px);animation:up .35s ease-out .65s forwards}
.snd{position:relative;display:flex;align-items:center;gap:6px;margin:-8px 0 0;font-size:15px;color:#9DB2D6;opacity:0;animation:up .35s ease-out .8s forwards}
.snd img{width:22px;height:22px}
.s-load .play,.s-load .snd{opacity:0!important;transition:opacity .15s;animation:none}
.dots{position:absolute;top:calc(50% + 44px);display:flex;gap:8px;opacity:0}
.s-load .dots{opacity:1;transition:opacity .2s .6s}
.dots b{width:9px;height:9px;border-radius:50%;background:#2EE6C5;animation:blink 1s infinite}
.dots b:nth-child(2){animation-delay:.2s}.dots b:nth-child(3){animation-delay:.4s}

.skip{position:absolute;top:12px;inset-inline-start:12px;font:inherit;font-weight:800;font-size:18px;color:#fff;background:#11295A;border:2px solid #5C8AC6;border-radius:999px;min-height:48px;padding:0 20px;z-index:2}
.s-game .skip{display:none}
.cap{position:absolute;left:16px;right:16px;bottom:96px;margin:0 auto;max-width:420px;padding:8px 16px;border-radius:16px;background:rgba(5,14,34,.86);border:1px solid #5C8AC6;text-align:center;font-size:18px;font-weight:700;line-height:1.35;display:none}
.s-film .cap.on{display:block}
.done{position:absolute;bottom:24px;font:inherit;font-weight:800;font-size:22px;color:#0B1E3F;background:#FFD23F;border:0;border-radius:999px;min-height:60px;padding:0 32px;box-shadow:inset 0 -4px 0 #E8B91F,0 4px 0 #050E22;display:none}
.s-end .done{display:block;animation:pop .45s cubic-bezier(.34,1.56,.64,1)}
.tap{position:absolute;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;border:3px solid #fff;opacity:0;pointer-events:none;z-index:5}
.tap.go{animation:tap .5s ease-out}

@keyframes pop{0%{opacity:0;transform:scale(.6)}60%{opacity:1;transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}
@keyframes shine{50%{filter:brightness(1.25) drop-shadow(0 0 14px rgba(255,190,80,.7))}}
@keyframes up{to{opacity:1;transform:none}}
@keyframes fade{to{opacity:1}}
@keyframes blink{50%{opacity:.25}}
@keyframes tap{0%{opacity:.9;transform:scale(.4)}100%{opacity:0;transform:scale(1.4)}}

/* reduced motion (and calm mode in the game): no scale, no shine, no lift; short fades only */
@media (prefers-reduced-motion:reduce){
 .logo,.play,.snd{transform:none!important}
 .s-splash .logo,.s-load .logo,.s-film .logo{animation:fade .2s linear forwards}
 .play,.snd{animation:fade .2s linear .2s forwards}
 .s-film .splash,.s-end .splash,.s-game .splash{transform:none}
 .under,.phone.s-game .under{transform:none}
 .s-end .done{animation:none}
}
/* ?step=: the state alone, with every animation at its end */
.still *,.still *::before{animation-delay:0s!important;animation-duration:.001s!important;transition:none!important}
</style>
</head>
<body>
<nav class="ctl" id="ctl"></nav>
<p class="note" id="note"></p>
<div class="phone s-splash" id="ph">
 <img class="under" id="under" alt="">
 <div class="ov" id="ov" role="dialog" aria-modal="true" aria-label="ניצני אופק, סרטון פתיחה">
  <video class="film" id="film" muted playsinline preload="none" aria-hidden="true"></video>
  <div class="splash">
   <img class="logo" src="intro-logo.webp" alt="ניצני אופק">
   <button class="play" id="play" type="button"><svg width="18" height="20" viewBox="0 0 18 20" aria-hidden="true"><path d="M2 1.5v17L17 10z" fill="#0B1E3F"/></svg>צפייה בסרטון</button>
   <p class="snd"><img src="../../assets/al/ui/sound-on.hf_20261124_204752_b82c7717-fa0a-4eef-b50e-de204f3e78e6.webp" alt="">עם קול</p>
   <div class="dots" aria-hidden="true"><b></b><b></b><b></b></div>
  </div>
  <p class="cap" id="cap">הצלצול האחרון. נפרדים מהחברים, ויוצאים לדרך.</p>
  <button class="skip" id="skip" type="button">דלגו</button>
  <button class="done" id="done" type="button">מתחילים</button>
 </div>
 <span class="tap" id="tap"></span>
</div>
<script src="intro-mock.js"></script>
</body>
</html>
