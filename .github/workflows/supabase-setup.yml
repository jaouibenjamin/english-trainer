name: supabase-setup
# The one-button setup of the Supabase project for the trial (tools/supabase_setup.py; the manual way is
# docs/owner/DAY0.md). Run by the owner only, by hand: Actions → supabase-setup → Run workflow. The dry run may run on
# `game` or `main`; a real run (and rotate-trial) only on `main`, which only the lead ships to.
# The repository is public, so this log is world-readable: the tool masks every key it fetches, the pepper it makes and
# the trial class's code before using them, and redacts every line it prints. Never re-run it with debug logging on.
# The two secrets are ENVIRONMENT secrets of `supabase-setup` (Settings → Environments: deployment branch main only,
# required reviewer the owner), never repository secrets: a repository secret can be read by any workflow on any
# branch, and the guards in this one file would protect nothing. GitHub enforces the environment's rules, not this file.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type exactly: setup trial'
        required: true
        type: string
      mode:
        description: 'dry-run tests the setup against a local stand-in (no secrets, nothing sent); real sets up the project (main only); rotate-trial gives the trial class a new code (main only)'
        required: true
        type: choice
        options: [dry-run, real, rotate-trial]
        default: dry-run
      redeploy:
        description: 'Deploy the five functions again even when they are there'
        required: false
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: supabase-setup
  cancel-in-progress: false
jobs:
  dry-run:
    if: inputs.mode == 'dry-run' && github.actor == 'jaouibenjamin' && github.triggering_actor == 'jaouibenjamin' && (github.ref == 'refs/heads/game' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0, pinned by commit
        with:
          persist-credentials: false
      - name: The setup, against a stand-in of the Management API and a local database
        run: python3 tests/setup_check.py
  setup:
    if: (inputs.mode == 'real' || inputs.mode == 'rotate-trial') && github.actor == 'jaouibenjamin' && github.triggering_actor == 'jaouibenjamin' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: supabase-setup
    steps:
      - name: The confirmation, the branch and the two secrets (only whether they are there)
        env:
          CONFIRM: ${{ inputs.confirm }}
          HAS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN != '' }}
          HAS_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD != '' }}
        run: |
          if [ "$CONFIRM" != "setup trial" ]; then echo 'Type exactly: setup trial'; exit 1; fi
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then echo 'A real run is only on main'; exit 1; fi
          if [ "$HAS_TOKEN" != "true" ] || [ "$HAS_DB_PASSWORD" != "true" ]; then
            echo 'SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD must be secrets of the supabase-setup environment'; exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0, pinned by commit
        with:
          persist-credentials: false
      # The Supabase CLI 2.122.1 for Linux x64, from npm (the same build as the release), pinned by version and by the
      # sha256 of the package. To update: pick a released version at least two weeks old, download its
      # @supabase/cli-linux-x64 tarball, check it against the registry's integrity, and change both values here.
      - name: The Supabase CLI, pinned by version and checksum
        run: |
          set -eu
          cd "$RUNNER_TEMP"
          curl -fsSL -o cli.tgz https://registry.npmjs.org/@supabase/cli-linux-x64/-/cli-linux-x64-2.122.1.tgz
          echo "eb727b9e512c8255de9583e92aad6404d7a36cbb0c5f48c32fc0fe341bae60b6  cli.tgz" | sha256sum -c -
          mkdir -p sb && tar -xzf cli.tgz -C sb
      - name: Set up the project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          CONFIRM: ${{ inputs.confirm }}
          REDEPLOY: ${{ inputs.redeploy }}
          MODE: ${{ inputs.mode }}
        run: |
          set -eu
          extra=""
          if [ "$REDEPLOY" = "true" ]; then extra="--redeploy"; fi
          if [ "$MODE" = "rotate-trial" ]; then extra="--rotate-trial"; fi
          python3 tools/supabase_setup.py --confirm "$CONFIRM" --cli "$RUNNER_TEMP/sb/package/bin/supabase" $extra
